version: 2
run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor

linters:
  enable:
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unconvert
    - unused

linters-settings:
  gocyclo:
    min-complexity: 15
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: indent-error-flow
      - name: time-naming

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - gocritic
        - gocyclo
        - gosec
